name: Bug Report
description: Report a bug with the Prismatik ambilight integration
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting
        - 🔍 Search [existing issues](https://github.com/FaserF/home-assistant-prismatik/issues) to avoid duplicates
        - 📖 Check the [documentation](https://github.com/FaserF/home-assistant-prismatik/blob/master/README.md)
        - 🔗 View the integration: [![Open your Home Assistant instance and show the prismatik integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=prismatik)

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Which version of home-assistant-prismatik are you running? (HACS or integration page)
      placeholder: e.g. v2021.3.0.1
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: |
        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      placeholder: e.g. 2026.6.4
    validations:
      required: true

  - type: dropdown
    id: ha_install_type
    attributes:
      label: Home Assistant Installation Type
      description: |
        Can be found in: [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true

  - type: input
    id: prismatik_version
    attributes:
      label: Prismatik Version
      description: Which version of Prismatik software are you running?
      placeholder: e.g. 5.11.2.37
    validations:
      required: true

  - type: dropdown
    id: prismatik_os
    attributes:
      label: Operating System Running Prismatik
      description: What OS is Prismatik running on?
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: connection_method
    attributes:
      label: Connection Method
      description: How is Home Assistant connecting to Prismatik?
      options:
        - Local network (same host)
        - Remote host (different machine)
    validations:
      required: true

  - type: input
    id: led_controller
    attributes:
      label: LED Controller Type
      description: What LED controller/device are you using with Prismatik? (optional)
      placeholder: e.g. Adalight, Arduino, WLED
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Configure integration with '...'
        2. Turn on / change brightness to '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Download diagnostics from the integration page and paste here (very helpful!):
        [![Open your Home Assistant instance and show the prismatik integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=prismatik)
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Enable debug logging and paste relevant log lines here.
        Add to `configuration.yaml`:
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.prismatik: debug
        ```
      render: shell
    validations:
      required: true
